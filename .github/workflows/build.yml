name: Build EmuNexa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install NSIS
        uses: ashutoshvarma/setup-nsis@v1
        with:
          version: '3.09'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build backend
        run: |
          $ldflags = "-s -w -X github.com/emunexa/emunexa/cmd/emu-nexa.Version=1.0.0 -X github.com/emunexa/emunexa/cmd/emu-nexa.Commit=${{ github.sha }}"
          wails build -ldflags "$ldflags" -tags production
      - name: Verify executable
        run: |
          $exe = "build/EmuNexa.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found" }
          & $exe --version
      - name: Create portable package
        run: |
          $portableDir = "dist/portable"
          if (Test-Path $portableDir) { Remove-Item -Recurse -Force $portableDir }
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          Copy-Item "build/EmuNexa.exe" "$portableDir/" -Force
          if (Test-Path "frontend/dist") { Copy-Item "frontend/dist" "$portableDir/" -Recurse -Force }
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/EmuNexa-Portable-1.0.0-windows-x64.zip" -Force
      - name: Create NSIS installer
        run: |
          $nsisPath = "${env:ProgramFiles}\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) { $nsisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsisPath build/installer.nsi
      - name: Generate checksums
        run: |
          $files = Get-ChildItem dist/*.exe, dist/*.zip
          foreach ($file in $files) {
            $sha256 = Get-FileHash -Algorithm SHA256 $file.FullName
            echo "$($sha256.Hash)  $($file.Name)" | Out-File -Append -Encoding UTF8 dist/checksums.txt
          }
          Get-Content dist/checksums.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emunexa-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/checksums*.txt
          retention-days: 30
